name = "trimbloat"
main = "worker.js"
compatibility_date = "2026-09-01"

# The script, its fingerprint and the winutil config are uploaded as static
# assets. The Worker fetches them from this binding and re-serves them with the
# right content type and headers - notably text/plain for the script, so a
# browser shows it rather than downloading it.
#
# ./public is generated by Publish-Trim.ps1 from a fresh build. Do not edit it
# by hand and do not commit it; the build is the source of truth.
[assets]
directory = "./public"
binding = "ASSETS"

# Not optional. With a Worker AND assets, Cloudflare serves a matching static
# file directly and never invokes the Worker - so /trim.ps1 would come back with
# the asset server's own content type instead of text/plain, and none of the
# security headers would be set. Running the Worker first is what makes the
# script readable in a browser rather than a download prompt.
run_worker_first = true

# Serve the apex and www from the same Worker. www is redirected to the apex by
# the Worker itself so there is exactly one canonical address.
[[routes]]
pattern = "trimbloat.com/*"
zone_name = "trimbloat.com"

[[routes]]
pattern = "www.trimbloat.com/*"
zone_name = "trimbloat.com"

[observability]
enabled = true
